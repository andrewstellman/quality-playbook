# Build configuration for the Quality Playbook pip distribution channel.
#
# HARD PACKAGING CONSTRAINT: `import bin` MUST FAIL after
# `pip install quality-playbook`. The full `bin/` tooling closure ships
# as package data under `quality_playbook_cli/_bundle/`; only
# `import quality_playbook_cli` resolves as a top-level Python import.
#
# The custom backend `_qpb_build_backend` wraps setuptools.build_meta
# and auto-stages `_bundle/` before delegating to setuptools, so a
# cold `python -m build` produces a complete wheel + sdist.
[build-system]
requires = ["setuptools>=68"]
build-backend = "_qpb_build_backend"
backend-path = ["."]

[project]
name = "quality-playbook"
version = "1.5.8"
description = "Quality engineering for AI-driven development — a skill for AI coding agents that finds the bugs review misses."
readme = "README.md"
requires-python = ">=3.10"
# SPDX license string (the deprecated `License :: OSI Approved ::
# Apache Software License` classifier and the TOML-table license
# form are intentionally omitted — both raise setuptools
# deprecation warnings on every build).
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
authors = [
    {name = "Andrew Stellman", email = "andrew@stellman.com"},
]
keywords = ["quality", "tdd", "code-review", "ai", "claude", "copilot", "cursor", "codex", "skill"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
quality-playbook = "quality_playbook_cli:main"

# Optional `harness` extra — the Test Harness (`bin/harness/*`)
# is a DEV-ONLY tool, excluded from the shipped channel closure.
# Adopters who only use the shipped skill don't pay for these
# dependencies; `bin/harness/tui.py` lazy-imports textual.
[project.optional-dependencies]
# psutil + textual MUST NOT leak into the skill bundle — the bundle
# installs into arbitrary target repos and extra deps would pollute
# the target's install. Enforcement pinned by
# bin/tests/harness/test_platform_compat_180.py.
harness = ["textual>=0.50", "psutil>=5.9"]

[project.urls]
Homepage = "https://github.com/andrewstellman/quality-playbook"
Source = "https://github.com/andrewstellman/quality-playbook"
Issues = "https://github.com/andrewstellman/quality-playbook/issues"

# Explicit packages list — DO NOT use `find` / `find_packages`.
# `find` would discover `bin/` (which has `__init__.py`) as a top-level
# import package and install it into site-packages, violating the hard
# constraint that `import bin` must fail post-install. Only the thin
# shim package is published.
[tool.setuptools]
packages = ["quality_playbook_cli"]
include-package-data = false

# Stage the QPB clone's source layout under quality_playbook_cli/_bundle/
# (via bin/build_channel_package.py before `python -m build`) and ship
# every file under it as package data. The explicit glob list covers
# the dotfile subtrees (.github/) that a bare `**/*` may exclude on
# some setuptools versions.
[tool.setuptools.package-data]
"quality_playbook_cli" = [
    "_bundle/**/*",
    "_bundle/.github/**/*",
    "_bundle/.github/skills/**/*",
    "_bundle/.github/skills/quality_gate/**/*",
]

# Exclude compiled-Python cruft from the wheel + sdist.
# `bin/build_channel_package.stage()` already purges these from the
# staged tree, but the defense-in-depth here keeps the wheel clean
# if a future build path skips the purge step.
[tool.setuptools.exclude-package-data]
"quality_playbook_cli" = [
    "_bundle/**/__pycache__/**",
    "_bundle/**/*.pyc",
    "_bundle/**/*.pyo",
]
