# v1.5.7 089u — pip distribution channel for the Quality Playbook.
#
# This file makes `pip install quality-playbook` / `uvx quality-playbook` /
# `pipx run quality-playbook` viable.
#
# HARD PACKAGING CONSTRAINT (089u decision, 2026-05-22): the package
# ships the QPB tooling + skill bundle as DATA, exposed only through
# the thin `quality_playbook_cli` shim package. The full `bin/`
# tooling closure is NOT installed as a top-level import package —
# `python -c "import bin"` MUST FAIL after `pip install`. Only
# `import quality_playbook_cli` resolves. See
# `docs/design/QPB_v1.6.x_Distribution_Channels_Proposal.md` for
# the design and `bin/build_channel_package.py` for the build-time
# stager that assembles the data from `_bundle_files()` (single
# source of truth).

# v1.5.7 090c (cold-build empty-bundle hole fix): custom backend
# `_qpb_build_backend` wraps setuptools.build_meta and auto-stages
# `quality_playbook_cli/_bundle/` via `bin/build_channel_package.
# stage()` before delegating. A cold `python -m build` from a
# fresh checkout (no prior stage) now produces a wheel + sdist
# containing the complete `_bundle/`. The 090b mandatory-member
# guard runs inside `stage()` — an incomplete bundle raises
# loudly before the wheel can be built.
[build-system]
requires = ["setuptools>=68"]
build-backend = "_qpb_build_backend"
backend-path = ["."]

[project]
name = "quality-playbook"
version = "1.5.8"
description = "Quality engineering for AI-driven development — a skill for AI coding agents that finds the bugs review misses."
readme = "README.md"
requires-python = ">=3.10"
# v1.5.7 090c F: SPDX string (replaces the deprecated TOML-table
# form `{text = "Apache-2.0"}`); the deprecated `License :: OSI
# Approved :: Apache Software License` classifier is dropped too
# — clears setuptools `SetuptoolsDeprecationWarning`s on every
# build.
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
authors = [
    {name = "Andrew Stellman", email = "andrew@stellman.com"},
]
keywords = ["quality", "tdd", "code-review", "ai", "claude", "copilot", "cursor", "codex", "skill"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
quality-playbook = "quality_playbook_cli:main"

# v1.5.7 119: optional `harness` extra. The Test Harness
# (`bin/harness/*`) is a DEV-ONLY tool, excluded from the
# shipped channel closure (91 invariant; bundle-safety
# enforced by `_bundle_files`). 119 rebuilds the live TUI
# (`qpb_harness tui`) on `textual` for scroll/mouse/follow-
# tail behavior; the curses fallback remains available via
# `qpb_harness tui --curses` for users who prefer the
# dependency-free path.
#
# Adopters who only use the shipped skill don't pay for
# textual — it isn't a hard dependency anywhere in the
# shipped surface (verified: no shipped `bin/` module
# imports textual at module load; the launch fn in
# `bin/harness/tui.py` lazy-imports).
[project.optional-dependencies]
# v1.5.7 182: psutil added as a harness-only dep for cross-
# platform process management (pid liveness, tree-kill on
# Windows, exit-code recovery from orphans, recycling-safe
# identity via (pid, create_time) tuples). psutil is harness-
# ONLY — the skill bundle MUST NOT depend on it (skill bundles
# install into arbitrary target repos and extra deps pollute
# the target's install). The harness-only enforcement is
# pinned by test_182_psutil_does_not_leak_into_skill_bundle in
# bin/tests/harness/test_platform_compat_180.py.
harness = ["textual>=0.50", "psutil>=5.9"]

[project.urls]
Homepage = "https://github.com/andrewstellman/quality-playbook"
Source = "https://github.com/andrewstellman/quality-playbook"
Issues = "https://github.com/andrewstellman/quality-playbook/issues"

# v1.5.7 089u: explicit packages list — DO NOT use `find` / `find_packages`.
# `find` would discover `bin/` (which has `__init__.py`) as a top-level
# import package and install it into site-packages, violating the hard
# constraint that `import bin` must fail post-install. Only the thin
# shim package is published.
[tool.setuptools]
packages = ["quality_playbook_cli"]
include-package-data = false

# Stage the QPB clone's source layout under quality_playbook_cli/_bundle/
# (via bin/build_channel_package.py before `python -m build`) and ship
# every file under it as package data. The explicit glob list covers
# the dotfile subtrees (.github/) that a bare `**/*` may exclude on
# some setuptools versions.
[tool.setuptools.package-data]
"quality_playbook_cli" = [
    "_bundle/**/*",
    "_bundle/.github/**/*",
    "_bundle/.github/skills/**/*",
    "_bundle/.github/skills/quality_gate/**/*",
]

# v1.5.7 089y T-B: exclude compiled-Python cruft from the wheel +
# sdist. `bin/build_channel_package.stage()` already purges these
# from the staged tree (`_purge_compiled_artifacts`), but the
# defense-in-depth pattern here keeps the wheel clean even if a
# future build path skips the purge step (e.g. a custom build
# orchestration that calls `python -m build` without first running
# `bin/build_channel_package.py`).
[tool.setuptools.exclude-package-data]
"quality_playbook_cli" = [
    "_bundle/**/__pycache__/**",
    "_bundle/**/*.pyc",
    "_bundle/**/*.pyo",
]
